<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Secdash</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <span class="logo">◢ SECDASH</span>
  <nav id="nav" aria-label="Pages">
    <button data-page="overview">Overview</button>
    <button data-page="intel">Repos &amp; Exploits</button>
    <button data-page="rf">Recorded Future</button>
    <button data-page="search">Search</button>
  </nav>
  <span class="live" id="live"><span id="lt">CONNECTING</span></span>
  <span class="grow"></span>
  <span class="quota" id="ghq"></span>
  <button class="btn" id="mine" title="Only show items that match the keywords in config.py">My stack</button>
  <button class="btn" id="brief">Brief</button>
  <button class="btn" id="rf" title="Refresh every source now">↻ Refresh</button>
</header>
<main id="main"><div class="empty">Loading live data…</div></main>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status"></div>
<div id="dlg" role="dialog" aria-modal="true" aria-label="Threat brief">
  <div class="dbox">
    <div class="drow">
      <b>Threat brief</b><span class="grow"></span>
      <button class="btn" id="cmd">Copy Markdown</button>
      <button class="btn" id="csl">Copy for Slack</button>
      <a class="btn" href="/api/export?fmt=csv&amp;dl=1" download>CSV</a>
      <a class="btn" href="/api/export?fmt=json&amp;dl=1" download>JSON</a>
      <a class="btn" href="/api/export?fmt=md&amp;dl=1" download>.md</a>
      <button class="btn" id="cls">Close</button>
    </div>
    <textarea id="bt" readonly aria-label="Brief text"></textarea>
  </div>
</div>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
